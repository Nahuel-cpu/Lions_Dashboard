services:
    app:
        build:
            context: .
            target: app
            # Echo lee VITE_REVERB_* en build time: tienen que coincidir con los
            # puertos expuestos por compose (nginx 8088, reverb 8089).
            args:
                VITE_APP_NAME: 'Lions Dashboard'
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-lionsreverbkey}
                VITE_REVERB_HOST: localhost
                VITE_REVERB_PORT: '8089'
                VITE_REVERB_SCHEME: http
        image: ghcr.io/nahuel-cpu/lions_dashboard/app:latest
        restart: unless-stopped
        env_file: .env.docker
        environment:
            APP_URL: http://localhost:8088
        volumes:
            - db-data:/var/www/html/database
            - storage-data:/var/www/html/storage
        # /tmp/ready lo crea el entrypoint al terminar migrate/seed: nginx y
        # reverb no arrancan hasta que la app puede responder.
        healthcheck:
            test: ['CMD', 'test', '-f', '/tmp/ready']
            interval: 3s
            timeout: 3s
            retries: 60

    nginx:
        build:
            context: .
            target: web
        image: ghcr.io/nahuel-cpu/lions_dashboard/web:latest
        restart: unless-stopped
        ports:
            - '8088:80'
        depends_on:
            app:
                condition: service_healthy

    reverb:
        image: ghcr.io/nahuel-cpu/lions_dashboard/app:latest
        restart: unless-stopped
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        env_file: .env.docker
        environment:
            APP_URL: http://localhost:8088
            # reverb no comparte la base del app: cache en archivos, no en SQLite
            CACHE_STORE: file
        ports:
            - '8089:8080'
        depends_on:
            app:
                condition: service_healthy

volumes:
    db-data:
    storage-data:
