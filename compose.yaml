services:
    app:
        build:
            context: .
            # Echo lee VITE_REVERB_* en build time: tienen que coincidir con los
            # puertos expuestos por compose (nginx 8088, reverb 8089).
            args:
                VITE_APP_NAME: 'Lions Dashboard'
                VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-lionsreverbkey}
                VITE_REVERB_HOST: localhost
                VITE_REVERB_PORT: '8089'
                VITE_REVERB_SCHEME: http
        image: lions-dashboard
        restart: unless-stopped
        env_file: .env.docker
        environment:
            APP_URL: http://localhost:8088
        volumes:
            - db-data:/var/www/html/database
            - storage-data:/var/www/html/storage

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '8088:80'
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    reverb:
        image: lions-dashboard
        restart: unless-stopped
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        env_file: .env.docker
        environment:
            APP_URL: http://localhost:8088
            # reverb no comparte la base del app: cache en archivos, no en SQLite
            CACHE_STORE: file
        ports:
            - '8089:8080'
        depends_on:
            - app

volumes:
    db-data:
    storage-data:
