server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolver embebido de Docker con cache corto: si el contenedor app
        # se recrea (IP nueva), nginx lo re-resuelve sin reiniciar.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fastcgi_upstream app:9000;
        fastcgi_pass $fastcgi_upstream;
        include fastcgi_params;
        # $document_root (literal) y no $realpath_root: nginx y php-fpm son
        # contenedores distintos y el código sólo existe en el de php-fpm.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }
}
