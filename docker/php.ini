; Ajustes del app sobre php.ini-production (control 20 de la guía 27 puntos:
; sin display_errors en producción)
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
display_errors = Off
log_errors = On

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 32M
